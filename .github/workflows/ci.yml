name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app alembic tests
      - name: Run tests
        run: python -m pytest -q

  integration:
    name: Docker integration
    runs-on: ubuntu-latest
    needs: tests
    env:
      API_KEY: ci-test-key-not-for-production
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      RABBITMQ_USER: payments
      RABBITMQ_PASSWORD: payments
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml config --quiet
      - name: Build and start services
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up --build --detach
      - name: Run end-to-end smoke test
        run: python tests/smoke_test.py
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color || true
      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down --volumes --remove-orphans
